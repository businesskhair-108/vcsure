<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VC Sure — Where startups meet the right VCs</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Instrument+Serif:ital@0;1&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --surface-2:#f5f3ee; --border:rgba(28,43,51,.1);
  --ink:#1c2b33; --ink-dim:#5b6b73; --ink-faint:#8b98a0;
  --accent:#0e7490; --accent-ink:#0b5a70; --accent-soft:#e3f2f5;
  --navy:#1e3a5f; --gold:#d4a73a; --gold-soft:#f7efdc;
  --green:#059669; --green-soft:#e4f4ee; --amber:#b45309; --amber-soft:#fceedb;
  --red:#be123c; --red-soft:#fbe8ec;
  --radius:16px; --radius-s:10px;
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-serif:'Instrument Serif',Georgia,serif;
  --font-mono:'Azeret Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overscroll-behavior-x:none}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overscroll-behavior-x:none;
  background-image:radial-gradient(rgba(14,116,144,.045) 1px,transparent 1px);background-size:26px 26px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,116,144,.12)}
::selection{background:var(--accent-soft)}
a{color:var(--accent-ink)}

/* v6 polish */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.searchbox{position:relative;flex:1;min-width:180px;max-width:320px}
.searchbox input{padding-left:32px}
.searchbox::before{content:"\2315";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:15px;pointer-events:none}
.searchbox kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:var(--surface-2);pointer-events:none}
.saveWarn{background:var(--red-soft);color:var(--red);font-size:12.5px;font-weight:600;text-align:center;padding:8px 14px}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
.nav-tab{min-height:36px}
@media print{.nav,.bottomNav,.footer,.deckNotif{display:none!important}}
.prio{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px;border:1px dashed rgba(212,167,58,.6);background:var(--gold-soft);border-radius:var(--radius-s);font-size:13px;cursor:pointer}
.prio input{width:auto;margin-top:3px}
.pack{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--border);background:#fff;border-radius:12px;padding:14px 16px;font-size:14px}
.pack small{display:block;color:var(--ink-dim);font-size:12px;margin-top:2px}
.pack:hover,.pack.hot{border-color:#d4a73a;box-shadow:0 4px 14px rgba(212,167,58,.25)}
/* portal content wrapper — consistent side breathing room; header/bottom nav stay full-width */
#viewRoot.portal-content{width:100%;max-width:1088px;margin:0 auto;padding:26px 24px 70px;box-sizing:border-box}
.nav-inner{padding-left:24px!important;padding-right:24px!important}
.footer{padding-left:24px!important;padding-right:24px!important;box-sizing:border-box}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.subtabs .chip{cursor:pointer;font-family:inherit}
@media(max-width:700px){
  #viewRoot.portal-content{padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
  .nav-inner{padding-left:16px!important;padding-right:16px!important}
  .footer{padding-left:16px!important;padding-right:16px!important}
}
.filters{position:relative;z-index:20}
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:140px;max-width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;line-height:1.3;text-align:left;transition:border-color .15s,box-shadow .15s}
.dd-btn svg{flex-shrink:0;color:var(--ink-faint);transition:transform .15s}
.dd-btn:hover{border-color:rgba(14,116,144,.4)}
.dd.open .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,116,144,.12)}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-menu{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:40;min-width:100%;width:max-content;max-width:min(280px,calc(100vw - 32px));max-height:min(320px,60vh);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:5px;box-shadow:0 18px 40px -16px rgba(28,43,51,.3)}
.dd.open .dd-menu{display:block;animation:fadeUp .16s both}
.dd.right .dd-menu{left:auto;right:0}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;background:none;border-radius:8px;padding:9px 11px;font-size:13.5px;font-weight:500;color:var(--ink);text-align:left}
.dd-opt:hover{background:var(--surface-2)}
.dd-opt.sel{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
@media(max-width:700px){.dd-btn{font-size:14px}}
.asst{position:fixed;right:20px;bottom:20px;z-index:90;width:380px;max-width:calc(100vw - 24px);height:min(560px,calc(100vh - 40px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 30px 60px -24px rgba(28,43,51,.35);overflow:hidden;animation:popIn .18s}
.asstHead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--accent-soft);border-bottom:1px solid rgba(14,116,144,.2)}
.asstHead .logo-mark{width:30px;height:30px;font-size:11px;flex-shrink:0}
.asstT{flex:1;min-width:0}.asstT b{display:block;font-size:14px}.asstT span{display:block;font-size:11.5px;color:var(--ink-dim)}

.asstX{flex-shrink:0;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#fff;border:1px solid rgba(14,116,144,.25);color:var(--accent-ink);transition:background .15s,transform .06s,border-color .15s}
.asstX:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.asstX:active{transform:scale(.94)}
@media(max-width:700px){
  .meet-top .grow{flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:2px 8px}
  .meet-top .grow>.chip{flex-shrink:0;white-space:nowrap}
  .meet-top .grow>b{min-width:0;overflow-wrap:anywhere}
  .meet-top .grow>span.dim{flex:1 1 auto;min-width:0}
}
@media(max-width:700px){.asstX{width:44px;height:44px;border-radius:12px}}
.asstLog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.asst .cmsg.them{background:var(--accent-soft);border-color:rgba(14,116,144,.2);max-width:92%}
.asstIn{padding:12px 14px;border-top:1px solid var(--border)}
.askbtn{color:var(--accent-ink)!important;font-weight:700}
.askbtn:hover{background:var(--accent-soft)!important;color:var(--accent-ink)!important}
.askbtn .mm{display:none}
.msgWS{display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:calc(100vh - 250px);min-height:440px}
.msgList{border-right:1px solid var(--border);overflow-y:auto;min-width:0}
.msgList .pRow{margin:0;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:13px 14px}
.msgList .pRow.sel{background:var(--accent-soft)}
.msgThread{display:flex;flex-direction:column;min-width:0;min-height:0}
.msgHead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.msgHead .msgTitle{flex:1;min-width:0}
.msgBack{display:none}
.msgThread .chatLog{flex:1;max-height:none;margin:0;padding:14px 16px}
.msgThread .chatChips{padding:0 16px;margin-bottom:8px}
.msgThread .chatInput{padding:12px 16px;border-top:1px solid var(--border)}
@media(max-width:700px){
  .askbtn .dm{display:none}.askbtn .mm{display:inline}
  .asst{left:12px;right:12px;width:auto;bottom:calc(76px + env(safe-area-inset-bottom));height:min(520px,calc(100vh - 170px))}
  .msgWS{grid-template-columns:1fr;height:calc(100vh - 260px)}
  .msgWS .msgThread{display:none}
  .msgPage.has-sel .msgWS .msgList{display:none}
  .msgPage.has-sel .msgWS .msgThread{display:flex}
  .msgPage.has-sel .page-head{display:none}
  .msgPage.has-sel .msgWS{height:calc(100vh - 175px)}
  .msgList{border-right:none}
  .msgBack{display:inline-flex}
}
@supports(height:100dvh){@media(max-width:700px){.msgWS{height:calc(100dvh - 260px)}.msgPage.has-sel .msgWS{height:calc(100dvh - 175px)}}}
/* nav */
/* contain the card's swipe overflow at the page content wrapper, so a gesture
   can never change the document width, scroll the page or flip a breakpoint.
   `clip` (unlike `hidden`) creates no scroll container, so sticky nav is safe. */
#viewRoot{overflow-x:hidden;overflow-x:clip}
.nav{position:sticky;top:0;z-index:50;background:rgba(250,248,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.2px;cursor:pointer;white-space:nowrap}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--navy));color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:600}
.logo small{font-weight:500;color:var(--ink-dim);font-size:10.5px;display:block;line-height:1.2}
.nav-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{border:none;background:none;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-dim);white-space:nowrap}
.nav-tab:hover{background:rgba(14,116,144,.08);color:var(--ink)}
.nav-tab.active{background:var(--accent-soft);color:var(--accent-ink)}
.acct{margin-left:auto;display:flex;align-items:center;gap:10px}
.acct .who{font-size:12.5px;line-height:1.25;text-align:right}
.acct .who b{display:block;font-size:13px}
.acct .who span{color:var(--ink-faint);font-size:11px}
.gavatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.linkout{border:none;background:none;color:var(--ink-dim);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px}
.linkout:hover{background:var(--red-soft);color:var(--red)}
.wrap{max-width:1040px;margin:0 auto;padding:26px 20px 70px}
.footer{max-width:1040px;margin:0 auto;padding:18px;color:var(--ink-faint);font-size:12px;text-align:center}

/* landing */
.land{max-width:1040px;margin:0 auto;padding:0 20px 80px}
.land-nav{display:flex;align-items:center;gap:14px;padding:18px 0}
.land-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center;padding:44px 0 54px}
@media(max-width:880px){.land-hero{grid-template-columns:1fr;gap:26px;padding-top:20px}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border:1px solid rgba(14,116,144,.2);padding:5px 12px;border-radius:99px;margin-bottom:18px}
.hero-eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
h1.hero{font-family:var(--font-serif);font-weight:400;font-size:52px;line-height:1.06;letter-spacing:-.5px}
@media(max-width:640px){h1.hero{font-size:36px}}
h1.hero em{color:var(--accent);font-style:italic}
.hero-sub{color:var(--ink-dim);font-size:16.5px;max-width:480px;margin:18px 0 26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-note{margin-top:14px;font-size:12.5px;color:var(--ink-faint)}
.preview{position:relative}
.stack{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.stack .stk{position:absolute;inset:0;opacity:0;pointer-events:none;transform-origin:50% 92%;backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.25,1),opacity .35s ease}
.stack .stk.is-front{position:relative;opacity:1;pointer-events:auto;z-index:3;cursor:grab}
.stack .stk.is-front.is-drag{cursor:grabbing}
.stack .stk.is-next{opacity:1;transform:translate3d(0,16px,0) scale(.965);z-index:2}
.stack .stk.is-third{opacity:1;transform:translate3d(0,32px,0) scale(.93);z-index:1}
.stack .stk.is-drag{transition:none;will-change:transform}
/* background cards show only their card edge/surface — never their inner content */
.stack .stk.is-back > *{visibility:hidden}
.stack .stk.is-out{z-index:4}
/* keep the card on its own compositor layer for the whole release animation */
.stack .stk.is-anim{will-change:transform}
.preview-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:0 30px 60px -30px rgba(28,43,51,.25);transform:rotate(1.2deg)}
.preview-card .row{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.preview-card .row b{font-size:16px;letter-spacing:-.1px}
.preview-card .row .dim{margin-top:3px}
.preview-card .why{gap:7px;margin-top:0}
.preview-card .meta-row{gap:7px;margin-top:14px}
.preview-card .actions{gap:9px;margin-top:20px}
.preview-card .chip{padding:4px 11px}
.float{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:0 18px 40px -18px rgba(28,43,51,.3);font-size:12.5px;display:flex;gap:8px;align-items:center}
.float.a{top:-16px;right:-8px;transform:rotate(-2deg)}
.float.b{bottom:-14px;left:-10px;transform:rotate(1.5deg)}
.float b{font-family:var(--font-mono)}
.land-sect{padding:34px 0}
.land-sect h2{font-family:var(--font-serif);font-weight:400;font-size:32px;letter-spacing:-.3px;margin-bottom:6px}
.land-sect .sub{color:var(--ink-dim);max-width:560px;margin-bottom:22px}
.portals{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.portals{grid-template-columns:1fr}}
.portal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;position:relative;overflow:hidden}
.portal::after{content:"";position:absolute;inset:auto -30% -55% auto;width:75%;aspect-ratio:1;border-radius:50%;opacity:.09}
.portal.startup::after{background:var(--accent)}
.portal.vcp::after{background:var(--navy)}
.portal h3{font-size:19px;margin:12px 0 8px}
.portal p{color:var(--ink-dim);font-size:14px;margin-bottom:16px}
.portal .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.portal.startup .tag{color:var(--accent-ink)}
.portal.vcp .tag{color:var(--navy)}
.portal ul{list-style:none;margin:0 0 18px}
.portal li{font-size:13.5px;color:var(--ink-dim);padding:5px 0;display:flex;gap:8px;align-items:baseline}
.portal li::before{content:"—";color:var(--accent);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:18px}
.step .n{font-family:var(--font-mono);font-weight:600;color:var(--accent-ink);font-size:12px}
.step b{display:block;margin:5px 0 4px;font-size:14.5px}
.step span{font-size:13px;color:var(--ink-dim)}

/* google */
.gbtn{display:inline-flex;align-items:center;gap:11px;background:#fff;border:1px solid #dadce0;border-radius:10px;padding:11px 18px;font-size:14.5px;font-weight:600;color:#3c4043;box-shadow:0 1px 2px rgba(60,64,67,.15);transition:box-shadow .15s}
.gbtn:hover{box-shadow:0 2px 6px rgba(60,64,67,.25)}
.gmodal{font-family:Roboto,system-ui,sans-serif;color:#202124;max-width:400px;width:100%;background:#fff;border-radius:14px;padding:38px 34px 30px;border:1px solid #dadce0}
.gmodal h2{font-family:'Google Sans',Roboto,sans-serif;font-size:23px;font-weight:500;color:#202124}
.gmodal .gsub{color:#5f6368;font-size:14.5px;margin:8px 0 22px}
.gmodal .gsub b{color:#1a73e8;font-weight:600}
.gaccount{display:flex;gap:14px;align-items:center;border:1px solid #dadce0;border-radius:12px;padding:14px;cursor:pointer;transition:background .12s}
.gaccount:hover{background:#f8f9fa}
.gaccount .em{font-size:13.5px;color:#5f6368}
.gaccount .nm{font-size:15px;font-weight:500;color:#202124}
.gdot{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1a73e8,#0e7490);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15px}
.gother{margin-top:12px;border:none;background:none;color:#1a73e8;font-size:14px;font-weight:600;padding:8px 4px;cursor:pointer}
.ginput{margin-top:18px}
.ginput label{display:block;font-size:12.5px;color:#5f6368;font-weight:500;margin-bottom:4px}
.ginput input{border:1px solid #dadce0;border-radius:6px;padding:12px 14px;font-size:15px;width:100%}
.ginput input:focus{border-color:#1a73e8;box-shadow:0 0 0 1px #1a73e8;outline:none}
.grow{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.grow .gnext{background:#1a73e8;color:#fff;border:none;border-radius:6px;padding:10px 26px;font-size:14.5px;font-weight:600;cursor:pointer}
.grow .gcancel{border:none;background:none;color:#1a73e8;font-size:14px;font-weight:600;cursor:pointer}

/* app shared */
h2.apptitle{font-size:24px;font-weight:800;letter-spacing:-.4px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{color:var(--ink-dim);font-size:13.5px;max-width:560px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card.hero{background:linear-gradient(135deg,var(--accent-soft),#fff 60%);border-color:rgba(14,116,144,.18)}
.card.goldy{background:var(--gold-soft);border-color:rgba(212,167,58,.4)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-dim)}
.chip.acc{background:var(--accent-soft);border-color:rgba(14,116,144,.25);color:var(--accent-ink)}
.chip.gold{background:var(--gold-soft);border-color:rgba(212,167,58,.35);color:#8a6a1c}
.chip.green{background:var(--green-soft);color:#06604a;border-color:rgba(5,150,105,.25)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:rgba(180,83,9,.25)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:rgba(190,18,60,.22)}
.chip.navy{background:#e8eff7;color:var(--navy);border-color:rgba(30,58,95,.22)}
.chip.slate{background:#eef1f6;color:#47536a;border-color:#d7dde6}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;background:var(--accent);color:#fff;transition:transform .06s,box-shadow .15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{box-shadow:0 4px 14px rgba(14,116,144,.3)}
.btn:active{transform:scale(.97)}
.btn.navy{background:var(--navy)}
.btn.navy:hover{box-shadow:0 4px 14px rgba(30,58,95,.35)}
.btn.ghost{background:#fff;color:var(--accent-ink);border:1px solid rgba(14,116,144,.35)}
.btn.subtle{background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--border)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:14px 16px}
.stat b{font-size:22px;font-weight:800;font-family:var(--font-mono)}
.stat span{display:block;font-size:11.5px;color:var(--ink-dim);font-weight:600;margin-top:2px}
/* consolidated metrics strip — one card instead of four */
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 6px;margin-bottom:18px}
.statstrip .cell{padding:0 16px;border-right:1px solid var(--border)}
.statstrip .cell:last-child{border-right:none}
.statstrip b{display:block;font-size:21px;font-weight:800;font-family:var(--font-mono)}
.statstrip span{display:block;font-size:11.5px;color:var(--ink-dim);font-weight:600;margin-top:2px}
/* quiet secondary links — keeps one clear primary action per section */
.quiet{background:none;border:none;color:var(--ink-dim);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;font-family:inherit}
.quiet:hover{color:var(--accent-ink)}
.minilinks{display:flex;gap:14px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.howrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;font-family:var(--font-mono)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-dim)}
.empty b{display:block;color:var(--ink);margin-bottom:6px;font-size:15px}
.note{font-size:12.5px;color:var(--ink-dim);background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-s);padding:10px 14px}
.section-label{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.section-label::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-dim);margin:12px 0 5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select{width:auto;min-width:140px}
.mono{font-family:var(--font-mono)}
.dim{color:var(--ink-dim)}
.who{display:flex;gap:12px;align-items:flex-start}
.who .body{flex:1;min-width:0}
.fit{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ring{position:relative;isolation:isolate;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:12.5px;flex-shrink:0;border:3px solid var(--accent-soft);color:var(--accent-ink);background:radial-gradient(circle at 50% 50%,var(--surface) 0 62%,transparent 63%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--accent-soft) 0)}
.ring.navy{border-color:#dfe8f2;color:var(--navy);background:radial-gradient(circle at 50% 50%,var(--surface) 0 62%,transparent 63%),conic-gradient(var(--navy) calc(var(--p)*1%),#dfe8f2 0)}
.why{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.meet{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start;border:1px solid var(--border);border-radius:var(--radius-s);padding:14px;background:var(--surface);margin-bottom:10px}
.meet-top{display:flex;gap:12px;align-items:flex-start;min-width:0}
.meet-top .grow{flex:1;min-width:0}
.meet-body{grid-column:1;min-width:0}
.meet-actions{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.meet .grow{flex:1;min-width:0}
.slot{font-family:var(--font-mono);font-size:12.5px;background:var(--accent-soft);color:var(--accent-ink);padding:6px 10px;border-radius:8px;display:inline-block;margin-top:6px}

/* meeting chat */
.chatLog{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:4px 2px;margin:12px 0}
.cmsg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.45}
.cmsg.me{align-self:flex-end;background:var(--accent-soft);color:var(--accent-ink);border-bottom-right-radius:4px}
.cmsg.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.cmsg.sys{align-self:center;background:transparent;color:var(--ink-faint);font-size:11.5px;font-weight:600;text-align:center}
.cmsg .ct{display:block;font-size:10px;color:var(--ink-faint);margin-top:3px;font-family:var(--font-mono)}
.chatChips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chatChips .chip{cursor:pointer}
.chatInput{display:flex;gap:8px}
.chatInput input{flex:1}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(28,43,51,.5);z-index:100;display:grid;place-items:center;padding:18px;animation:fadeIn .15s}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;border:1px solid var(--border);animation:popIn .18s}
.modal.wide{max-width:720px}
@keyframes popIn{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger>*{animation:fadeUp .4s both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* profile */
.readrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--border);font-size:13.5px;flex-wrap:wrap}
.readrow:last-child{border-bottom:none}
.readrow .k{color:var(--ink-faint);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}

/* AI note coach */
.coach{border:1px solid rgba(14,116,144,.3);background:var(--accent-soft);border-radius:var(--radius-s);padding:12px 14px;margin-top:12px;animation:fadeUp .25s both}
.coach b{font-size:13px;color:var(--accent-ink)}
.coach .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;margin:8px 0}
.coach .bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.coach ul{margin:6px 0 0 16px;font-size:12.5px;color:var(--ink-dim)}
.coach ul li{margin:3px 0}

/* deck viewer */
.deck{background:#10161d;color:#e8edf2;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.deck-head{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.deck-head .dh-main{flex:1;min-width:0}
.deck-head b{display:block;font-size:14.5px;color:#fff;letter-spacing:-.1px}
.deck-head .dh-sub{display:block;font-size:12px;color:#93a3b1;margin-top:3px}
.deck-x{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#e8edf2;font-size:14px;line-height:1;cursor:pointer}
.deck-x:hover{background:rgba(255,255,255,.18)}
.deck-stage{padding:34px 40px;min-height:320px;display:flex;flex-direction:column;justify-content:center}
.deck-slide{display:flex;flex-direction:column;justify-content:center}
.deck-slide h2{font-family:var(--font-serif);font-weight:400;font-size:30px;margin-bottom:14px;color:#fff;letter-spacing:-.2px}
.deck-slide .big{font-family:var(--font-serif);font-size:44px;line-height:1.12;color:#fff}
.deck-slide p{color:#aebccb;font-size:15px;max-width:540px;margin-top:10px}
.deck-slide .kpi{display:flex;gap:30px;margin-top:22px;flex-wrap:wrap}
.deck-slide .kpi div b{display:block;font-family:var(--font-mono);font-size:26px;color:#7fd4c8}
.deck-slide .kpi div span{display:block;font-size:11.5px;color:#7c8b99;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.deck-nav{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid rgba(255,255,255,.1)}
.deck-progress{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;min-width:60px}
.deck-progress i{display:block;height:100%;width:0;background:#7fd4c8;transition:width .25s ease}
.deck-counter{font-family:var(--font-mono);font-size:12px;color:#93a3b1;white-space:nowrap}
.deckbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#e8edf2;border-radius:8px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.deckbtn:hover{background:rgba(255,255,255,.2)}
.deckbtn:disabled{opacity:.35;cursor:default}
.deck-foot{padding:16px 20px 18px;border-top:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.deck-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.deck-fwd.sending{opacity:.8;cursor:progress}
.deck-fwd.sent{background:var(--green);color:#fff}
.deck-fwd.error{background:var(--red);color:#fff}
.deck-status{font-size:12px;color:#93a3b1;margin-top:10px}
.deck-status.ok{color:#7fd4c8}
.deck-status.bad{color:#ff9db1}
.deck-note{font-size:11.5px;color:#7c8b99;margin-top:8px;line-height:1.55;max-width:560px}
.trackchip{font-family:var(--font-mono);font-size:11px;color:#7fd4c8;display:inline-flex;align-items:center;gap:6px}
.trackchip::before{content:"";width:7px;height:7px;border-radius:50%;background:#7fd4c8;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* pitch-deck inbox pill */
.deckNotif{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:0 20px 45px -22px rgba(28,43,51,.4);max-width:390px;animation:notifIn .32s cubic-bezier(.2,.8,.25,1)}
@keyframes notifIn{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.deckNotif .dn-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.deckNotif .dn-ic svg{width:17px;height:17px}
.deckNotif .dn-body{flex:1;min-width:0}
.deckNotif .dn-body b{display:block;font-size:13.5px}
.deckNotif .dn-body span{display:block;font-size:12.5px;color:var(--ink-dim);margin-top:1px}
.deckNotif .dn-x{background:none;border:none;color:var(--ink-faint);font-size:13px;padding:4px 2px;cursor:pointer;flex-shrink:0}
.deckNotif .dn-x:hover{color:var(--ink)}

/* partner messages (VC internal) */
.pRow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius-s);padding:13px 14px;background:var(--surface);margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.pRow:hover{border-color:rgba(14,116,144,.35)}
.pRow .pr-main{flex:1;min-width:0}
.pRow b{display:block;font-size:14px}
.pRow .pr-sub{font-size:12.5px;color:var(--ink-dim);margin-top:3px}
.pRow .pr-last{font-size:12.5px;color:var(--ink-dim);margin-top:6px}
.pRow .pr-meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.pRow .pr-date{font-size:11px;color:var(--ink-faint);white-space:nowrap}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.pAttach{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:9px;max-width:100%}
.pAttach .pa-ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.pAttach .pa-ic svg{width:15px;height:15px}
.pAttach .pa-main{flex:1;min-width:0}
.pAttach b{display:block;font-size:13px}
.pAttach span{display:block;font-size:11.5px;color:var(--ink-dim);margin-top:1px}
.pAttach .btn{flex-shrink:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.formStatus{font-size:12.5px;color:var(--ink-dim);margin-top:10px}
.formStatus.ok{color:#06604a}
.formStatus.bad{color:var(--red)}
.shareRow{display:flex;gap:8px;align-items:center;margin-top:6px}
.shareRow input{font-family:var(--font-mono);font-size:12.5px}
.deRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.deRow input[type=file]{font-size:13px;padding:8px 10px;background:var(--surface-2)}
.deckver{font-family:var(--font-mono);font-size:11px;color:#93a3b1;white-space:nowrap;flex-shrink:0}

/* deck insights */
.heat{display:flex;gap:4px;align-items:flex-end;height:56px;margin-top:8px}
.heat .h{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),var(--accent-soft));min-height:8px;position:relative}
.heat .h span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-dim)}
.heat .h b{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);font-weight:500}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(7px);pointer-events:none;user-select:none}
.locked .lockcover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(250,248,244,.55);z-index:2}
.lockcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center;max-width:340px;box-shadow:0 16px 40px -16px rgba(28,43,51,.3)}
.lockcard b{display:block;font-size:15px;margin-bottom:6px}
.lockcard p{font-size:12.5px;color:var(--ink-dim);margin-bottom:12px}

/* perks */
.perk{display:flex;gap:14px;align-items:flex-start}
.perk .plogo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;font-family:var(--font-mono)}
.toggle{position:relative;width:42px;height:24px;border-radius:99px;background:var(--border);border:none;transition:background .2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:21px}
.togglerow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
.togglerow:last-child{border-bottom:none}
.togglerow b{font-size:13.5px;display:block}
.togglerow .sub{font-size:12px;color:var(--ink-dim)}
@media(max-width:640px){.wrap{padding:16px 20px calc(122px + env(safe-area-inset-bottom))}}

/* premium upsell */
.proBanner{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px}
.proBadge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-weight:600;font-size:10.5px;letter-spacing:.2em;padding:4px 10px;border-radius:99px;background:var(--gold-soft);color:#8a6a1c;border:1px solid rgba(212,167,58,.45)}
.proBanner h3{font-size:19px;letter-spacing:-.2px;margin:12px 0 6px;color:var(--ink)}
.proBanner p{color:var(--ink-dim);font-size:13.5px;max-width:580px}
.proFeats{margin:18px 0 0;padding-top:16px;border-top:1px dashed var(--border);display:grid;gap:13px}
.proFeat{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--ink-dim)}
.proFeat .ptick{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--green-soft);color:#06604a;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.proFeat b{display:block;color:var(--ink);font-size:13.5px;font-weight:700;margin-bottom:1px}
.proFoot{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.proCTA{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:700;cursor:pointer;transition:box-shadow .15s,transform .06s}
.proCTA:hover{box-shadow:0 6px 18px -8px rgba(30,58,95,.6)}
.proCTA:active{transform:scale(.98)}
.proPrice{color:var(--ink-dim);font-size:12px}
.proPrice s{color:var(--ink-faint);margin-right:6px}
.proMini{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.14em;background:linear-gradient(100deg,#d4a73a,#f1d27b);color:#3c2f0d;padding:3px 9px;border-radius:99px;flex-shrink:0}
.btn.gold{background:linear-gradient(100deg,#d4a73a,#f1d27b);color:#3c2f0d;font-weight:800}
.btn.gold:hover{box-shadow:0 4px 14px rgba(212,167,58,.45)}
.lockTeaser{display:flex;gap:12px;align-items:center;border:1px dashed rgba(212,167,58,.55);background:linear-gradient(120deg,rgba(212,167,58,.08),rgba(30,58,95,.05));border-radius:var(--radius-s);padding:13px 15px;margin-bottom:14px;cursor:pointer;transition:transform .12s}
.lockTeaser:hover{transform:translateY(-1px)}
.lockTeaser b{font-size:13.5px}
.lockTeaser .sub{font-size:12px;color:var(--ink-dim)}
.lockTeaser .lk{color:#b8860b;flex-shrink:0}
.lockTeaser svg{width:20px;height:20px;flex-shrink:0}
.lockTeaser{padding:14px;gap:12px;margin-bottom:12px;align-items:center}
.lockTeaser .ltIc{width:34px;height:34px;border-radius:10px;background:var(--gold-soft);color:#b8860b;display:grid;place-items:center;flex-shrink:0}
.lockTeaser .ltIc svg{width:18px;height:18px}
.lockTeaser .ltBody{flex:1;min-width:0}
.lockTeaser .ltTitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.lockTeaser .ltTitle .proMini{flex-shrink:0}
.lockTeaser .sub{display:block;margin-top:2px;line-height:1.4}

/* mobile bottom nav */
.bottomNav{display:none}
.footBrand{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:9px}
.footBrand .logo-mark{width:22px;height:22px;font-size:9.5px;border-radius:6px}
.footBrand b{font-size:13px;color:var(--ink-dim);letter-spacing:.02em}
.bTab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:var(--ink-faint);font-size:10px;font-weight:600;padding:6px 8px;border-radius:10px;min-width:52px}
.bTab svg{width:21px;height:21px}
.bTab.active{color:var(--accent-ink);background:var(--accent-soft)}
.bTab .bdg{position:absolute;top:2px;right:6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:99px;padding:1px 5px}
.moreSheet{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;background:rgba(28,43,51,.5);animation:fadeIn .15s}
.moreSheet .inner{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));animation:fadeUp .2s both}
.mRow{display:flex;gap:12px;align-items:center;width:100%;border:none;background:none;padding:13px 6px;border-bottom:1px dashed var(--border);font-size:14.5px;font-weight:600;color:var(--ink);text-align:left}
.mRow:last-child{border-bottom:none}
.mRow svg{width:20px;height:20px;color:var(--ink-dim)}
.mRow .bdg2{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
@media(max-width:700px){
  .nav-tabs{display:none!important}
  .nav-inner{padding:9px 20px;gap:8px}
  .logo{font-size:15px;gap:8px}
  .logo small{display:none}
  .logo-mark{width:28px;height:28px}
  .acct .who{display:none}
  .acct{margin-left:auto}
  .bottomNav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(250,248,244,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .wrap{padding:16px 20px calc(122px + env(safe-area-inset-bottom))}
  .footer{padding:14px 20px calc(108px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
function toast(){/* notifications removed per user request — silent actions */}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}
function cr(n){return n>=1?("\u20B9"+n+" Cr"):"\u20B9"+Math.round(n*100)+" L"}
function ago(ts){const m=(Date.now()-ts)/6e4;if(m<1)return"just now";if(m<60)return Math.round(m)+"m ago";const h=m/60;if(h<24)return Math.round(h)+"h ago";return Math.round(h/24)+"d ago"}

/* thesis freshness */
function freshChip(v){
  const d=daysSince(v.thesisUpdatedAt);
  if(d<=30)return `<span class="chip green" title="${esc(v.thesisNote||"")}">thesis fresh · ${d}d</span>`;
  if(d<=90)return `<span class="chip amber" title="${esc(v.thesisNote||"")}">thesis updated ${d}d ago</span>`;
  return `<span class="chip red" title="${esc(v.thesisNote||"")}">stale thesis · ${d}d</span>`;
}

/* fit */
function fit(vc,st){
  let s=10,why=[];
  if(vc.sectors.includes(st.sector)){s+=38;why.push("invests in "+st.sector)}
  if(vc.stages.includes(st.stage)){s+=26;why.push("writes cheques at "+st.stage)}
  else if(vc.stages.some(x=>STAGES.indexOf(x)===STAGES.indexOf(st.stage)+1)){s+=10;why.push("one stage early — building the relationship")}
  if(st.raising>=vc.cheque[0]&&st.raising<=vc.cheque[1]){s+=20;why.push("ask fits their cheque ("+cr(vc.cheque[0])+" to "+cr(vc.cheque[1])+")")}
  else if(st.raising<vc.cheque[0]){s+=4;why.push("ask below their minimum")}
  else{s+=6;why.push("ask above their typical cheque")}
  if(!why.length)why.push("adjacent thesis");
  return{score:Math.min(97,s),why};
}

/* cheque range guard — keeps thesis fit meaningful */
const CHEQUE_SPREAD_CAP=10;
function chequeHint(){return `<div style="font-size:11.5px;line-height:1.5;color:#7c4a03;background:var(--amber-soft);border:1px solid rgba(180,83,9,.25);border-radius:8px;padding:7px 10px;margin-top:8px"><b>Keep the range within ${CHEQUE_SPREAD_CAP}x</b> (e.g. \u20B92 Cr to \u20B920 Cr). A fund writing \u20B950 Cr cheques works nothing like a seed fund writing \u20B950 L ones — tighter theses mean higher-intent matches. Anything wider is capped automatically.</div>`}
function capCheque(mn,mx){
  if(isNaN(mn)||isNaN(mx)||mn<=0||mx<mn)return null;
  if(mx>mn*CHEQUE_SPREAD_CAP)return{cheque:[mn,+(mn*CHEQUE_SPREAD_CAP).toFixed(2)],capped:mx};
  return{cheque:[mn,mx],capped:null};
}
function capNote(cc){return cc&&cc.capped?`Cheque range capped at ${CHEQUE_SPREAD_CAP}x — saved as ${cr(cc.cheque[0])} to ${cr(cc.cheque[1])} — so matches stay high-intent.`:null}

      const investorQuiet=(m.side==="vc")===(m.direction==="out");
      m.reply=investorQuiet
        ?"System pass — investor inactivity. The fund didn't respond within the 7-day window, so the request was closed automatically. This is not a decline: your intro slot is released and you're free to request other funds."

      changed=true;
    }});

}

/* ================= hero card stack (drag to reveal) ================= */
let heroTop=0,heroDrag=null;
function heroCards(){return [...document.querySelectorAll("#heroStack .stk")]}
function heroFront(){const cs=heroCards();return cs.length?cs[heroTop%cs.length]:null}
function heroPaint(){
  const cs=heroCards();if(!cs.length)return;
  cs.forEach((c,i)=>{
    const off=(i-heroTop+cs.length)%cs.length;
    c.classList.toggle("is-front",off===0);
    c.classList.toggle("is-next",off===1);
    c.classList.toggle("is-third",off===2);
    /* cards behind the front show their edges only; a card mid fly-out keeps its content */
    c.classList.toggle("is-back",off!==0&&!c.classList.contains("is-out"));
  });
}
let heroRaf=0,heroPend=0,heroSettle={};
/* ONE gesture convention for every pointer type (touch, mouse, trackpad, pen):
     dx = currentX - startX   ->   dx < 0 means the user moved LEFT
   The card always follows the gesture, and exits the way it was thrown.
   Never invert this sign for a particular input device. */
function heroDx(e){return (e&&typeof e.clientX==="number"?e.clientX:0)-(heroDrag?heroDrag.x0:0)}
function heroDir(dx){return dx<0?-1:1}                 /* -1 = left, +1 = right */
function heroCrossed(dx,w){return Math.abs(dx)>Math.max(72,w*0.26)}
function heroDown(e){
  const cs=heroCards();if(!cs.length)return;
  if(heroDrag)return;                                   /* one pointer at a time */
  if(e.pointerType==="mouse"&&e.button!==0)return;      /* left mouse button only */
  const f=cs[heroTop%cs.length];if(!f)return;
  /* the gesture must START on the active card — nothing else on the page becomes draggable */
  if(e.target&&typeof f.contains==="function"&&!f.contains(e.target))return;
  /* keep the gesture inside the card: no parent/page handler ever sees it */
  if(typeof e.stopPropagation==="function")e.stopPropagation();
  const idx=cs.indexOf(f);
  if(heroSettle[idx]){clearTimeout(heroSettle[idx]);delete heroSettle[idx]}
  f.classList.remove("is-out");                                        /* re-grabbed mid-flight: it is the front card again */
  f.style.transition="none";f.style.transform="";f.style.opacity="";   /* cancel any stale transform */
  heroDrag={el:f,idx:idx,x0:(typeof e.clientX==="number"?e.clientX:0),dx:0,w:f.offsetWidth||320,pid:e.pointerId};
  heroPend=0;if(heroRaf){cancelAnimationFrame(heroRaf);heroRaf=0}
  f.classList.add("is-drag");
  /* mouse only: stop the browser turning a drag over text into a selection drag,
     which is what made the desktop gesture behave unlike touch. Touch is untouched. */
  if(e.pointerType==="mouse"&&typeof e.preventDefault==="function")e.preventDefault();
  const st=document.getElementById("heroStack");
  if(st&&st.setPointerCapture){try{st.setPointerCapture(e.pointerId)}catch(_){}}
}
function heroMove(e){
  if(!heroDrag)return;
  heroDrag.dx=heroDx(e);
  heroPend=heroDrag.dx;
  if(heroRaf)return;                        /* coalesce: one transform write per frame */
  heroRaf=requestAnimationFrame(()=>{
    heroRaf=0;
    if(!heroDrag)return;
    const d=heroPend;
    heroDrag.el.style.transform="translate3d("+d+"px,0,0) rotate("+(d/24)+"deg)";
    heroDrag.el.style.opacity=String(Math.max(.4,1-Math.abs(d)/460));
  });
}
function heroUp(){
  if(!heroDrag)return;
  if(heroRaf){cancelAnimationFrame(heroRaf);heroRaf=0}
  const el=heroDrag.el,idx=heroDrag.idx,dx=heroDrag.dx,w=heroDrag.w,pid=heroDrag.pid;heroDrag=null;
  const st=document.getElementById("heroStack");
  if(st&&st.releasePointerCapture){try{st.releasePointerCapture(pid)}catch(_){}}   /* release capture when the gesture ends */
  el.classList.remove("is-drag");
  el.classList.add("is-anim");
  const n=heroCards().length||3;
  if(heroCrossed(dx,w)){
    const dir=heroDir(dx);                             /* exits the way it was thrown */
    el.classList.add("is-out");                       /* stays on top, keeps content, while it leaves */
    el.style.transition="transform .42s cubic-bezier(.2,.8,.25,1),opacity .34s ease";
    el.style.transform="translate3d("+(dir*135)+"%,0,0) rotate("+(dir*9)+"deg)";
    el.style.opacity="0";
    heroTop=(heroTop+1)%n;               /* advance state at once: rapid swipes stay in order */
    heroPaint();
    if(heroSettle[idx])clearTimeout(heroSettle[idx]);
    heroSettle[idx]=setTimeout(()=>{
      delete heroSettle[idx];
      el.classList.remove("is-out");                  /* now a background card: edges only */
      el.classList.remove("is-anim");
      el.style.transition="none";
      el.style.transform="";el.style.opacity="";
      heroPaint();
      requestAnimationFrame(()=>{el.style.transition=""});
    },430);
  }else{
    /* subtle spring back: fast, controlled, no bounce */
    el.style.transition="transform .36s cubic-bezier(.22,1.15,.36,1),opacity .26s ease";
    el.style.transform="";el.style.opacity="";
    setTimeout(()=>{el.style.transition="";el.classList.remove("is-anim")},380);
  }
}

function googleModal(prefRole){if(prefRole)window._prefRole=prefRole;else if(!window._prefRole){showRoleChoice();return;}entryScreen="auth";authMode="signin";render();}
function toggleAuthMode(){
  authMode=authMode==="signin"?"signup":"signin";
  const signup=authMode==="signup";
  const h=$("#authHeading"),b=$("#authSubmit"),t=$("#authModeToggle"),pw=$("#authPassword");
  if(h)h.textContent=signup?"Create your account":"Welcome back";
  if(b)b.textContent=signup?"Create account":"Sign in";
  if(t)t.textContent=signup?"Already have an account? Sign in":"New to VC Sure? Create account";
  if(pw)pw.autocomplete=signup?"new-password":"current-password";
  authStatus("");
}
async function doGoogleSignIn(){
  if(!requireSupabase()||authBusy)return;
  if(location.protocol==="file:"){authStatus("Open VCSure through an HTTP/HTTPS address first. Google sign-in won't work from a file:// URL.",true);return;}
  authBusy=true;authStatus("Redirecting to Google…");
  try{
    if(window._prefRole)localStorage.setItem("vcsure_pending_role",window._prefRole);
    const redirectTo=window.location.origin+window.location.pathname;
    const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}});
    if(error)throw error;
  }catch(err){authStatus(authErrorMessage(err),true);authBusy=false;}
}
async function doEmailAuth(){
  if(!requireSupabase()||authBusy)return;
  const email=( $("#authEmail")?.value || "" ).trim().toLowerCase();
  const password=$("#authPassword")?.value||"";
  if(!email||!/^\S+@\S+\.\S+$/.test(email)){authStatus("Enter a valid email address.",true);return;}
  if(!password||password.length<8){authStatus("Use a password of at least 8 characters.",true);return;}
  authBusy=true;const submit=$("#authSubmit");if(submit){submit.disabled=true;submit.textContent=authMode==="signup"?"Creating…":"Signing in…";}
  try{
    let result;
    if(authMode==="signup"){
      if(window._prefRole){try{localStorage.setItem("vcsure_pending_role",window._prefRole);}catch(_){}}
      result=await sb.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin+window.location.pathname}});
      if(result.error)throw result.error;
      if(result.data.session){await acceptAuthenticatedUser(result.data.user,result.data.session);return;}
      authStatus("Account created. Check your inbox to confirm your email, then sign in.");
    }else{
      result=await sb.auth.signInWithPassword({email,password});
      if(result.error)throw result.error;
      await acceptAuthenticatedUser(result.data.user,result.data.session);return;
    }
  }catch(err){authStatus(authErrorMessage(err),true);}
  finally{authBusy=false;const b=$("#authSubmit");if(b){b.disabled=false;b.textContent=authMode==="signup"?"Create account":"Sign in";}}
}
async function acceptAuthenticatedUser(user,session){
  if(!user)return;
  const meta=user.user_metadata||{};
  const isSameUser=state.auth&&state.auth.id===user.id;
  /* Never carry another account's local profile into a newly authenticated account. */
  if(!isSameUser){
    state.me={name:"",startup:"",sector:"SaaS",stage:"Pre-seed",raising:2,traction:"",deckTitle:"",deckVersion:1,deckUpdatedAt:Date.now(),deckFile:"",deckHistory:[]};
    state.vcMe={name:"",type:"Micro-VC",city:"",sectors:["SaaS"],stages:["Pre-seed"],cheque:[1,4],thesisNote:"",thesisUpdatedAt:Date.now()};
    state.role=null;
  }
  state.authed=true;
  state.auth={name:meta.full_name||meta.name||user.email?.split("@")[0]||"User",email:user.email||"",id:user.id,provider:(user.app_metadata&&user.app_metadata.provider)||"email"};
  let pendingRole=null;try{pendingRole=localStorage.getItem("vcsure_pending_role");localStorage.removeItem("vcsure_pending_role");}catch(_){}
  const role=await loadProfileForUser(user);
  if(!role){state.role=pendingRole||meta.role||window._prefRole||null;}
  if(state.role&&state.role!=="founder"&&state.role!=="vc")state.role=null;
  save();closeModal();authBusy=false;
  if(!state.role)roleModal();
  else if(!onboarded())onboardModal();
  else{go("home");}
  render();
}
async function loadProfileForUser(user){
  if(!sb||!user)return null;
  try{
    const {data:founder,error:fErr}=await sb.from("founder_profiles").select("*").eq("id",user.id).maybeSingle();
    if(fErr)throw fErr;
    if(founder){
      state.role="founder";
      state.me={...state.me,name:founder.full_name||state.auth.name,startup:founder.startup_name||"",sector:founder.sector||"SaaS",stage:founder.funding_stage||"Pre-seed",raising:founder.funding_ask==null?2:Number(founder.funding_ask),traction:founder.traction||"",geography:founder.geography||"",businessModel:founder.business_model||""};
      return "founder";
    }
  }catch(err){console.error("VCSure founder profile load failed",err);}
  try{
    const {data:fund,error:vErr}=await sb.from("fund_profiles").select("*").eq("id",user.id).maybeSingle();
    if(vErr && vErr.code!=="42P01")throw vErr;
    if(fund){
      state.role="vc";
      state.vcMe={...state.vcMe,name:fund.fund_name||state.auth.name,type:fund.fund_type||"Micro-VC",city:fund.geography||"India",sectors:Array.isArray(fund.sectors)?fund.sectors:["SaaS"],stages:Array.isArray(fund.stages)?fund.stages:["Pre-seed"],cheque:[Number(fund.min_cheque)||1,Number(fund.max_cheque)||4],thesisNote:fund.thesis_note||"",thesisUpdatedAt:fund.thesis_updated_at?new Date(fund.thesis_updated_at).getTime():Date.now()};
      return "vc";
    }
  }catch(err){console.error("VCSure fund profile load failed",err);}
  return null;
}
async function persistCurrentProfile(){
  if(!sb||!state.authed||!state.auth?.id||!state.role)return false;
  const now=new Date().toISOString();
  try{
    if(state.role==="founder"){
      const payload={id:state.auth.id,full_name:state.me.name||state.auth.name||null,startup_name:state.me.startup||null,sector:state.me.sector||null,funding_stage:state.me.stage||null,funding_ask:Number(state.me.raising)||null,geography:state.me.geography||null,business_model:state.me.businessModel||null,traction:state.me.traction||null,updated_at:now};
      const {error}=await sb.from("founder_profiles").upsert(payload,{onConflict:"id"});
      if(error)throw error;
      return true;
    }
    if(state.role==="vc"){
      const payload={id:state.auth.id,fund_name:state.vcMe.name||state.auth.name||null,fund_type:state.vcMe.type||null,geography:state.vcMe.city||null,sectors:state.vcMe.sectors||[],stages:state.vcMe.stages||[],min_cheque:Number(state.vcMe.cheque?.[0])||null,max_cheque:Number(state.vcMe.cheque?.[1])||null,thesis_note:state.vcMe.thesisNote||null,thesis_updated_at:new Date(state.vcMe.thesisUpdatedAt||Date.now()).toISOString(),updated_at:now};
      const {error}=await sb.from("fund_profiles").upsert(payload,{onConflict:"id"});
      if(error)throw error;
      return true;
    }
  }catch(err){console.error("VCSure profile save failed",err);const w=$("#saveWarn");if(w){w.hidden=false;w.textContent="Your changes are saved on this device, but we couldn't sync your profile. Check your connection and Supabase table setup.";}return false;}
  return false;
}
async function initAuth(){
  if(!SUPABASE_CONFIGURED){render();return;}
  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(data.session?.user){await acceptAuthenticatedUser(data.session.user,data.session);return;}
  }catch(err){console.error("VCSure session restore failed",err);}
  render();
}
function signIn(email,name){
  /* Compatibility shim: route legacy entry points to the real authentication page. */
  if(!window._prefRole){showRoleChoice();return;}
  entryScreen="auth";authMode="signin";render();
}
async function signOut(){
  if(sb){try{const {error}=await sb.auth.signOut();if(error)console.error("VCSure sign-out failed",error);}catch(err){console.error("VCSure sign-out failed",err);}}
  state.authed=false;state.auth={name:"",email:""};state.role=null;entryScreen="role";save();go("welcome");
}
function onboarded(){return state.role==="founder"?!!state.me.startup:!!state.vcMe.name}

function finishOnboard(){
  let capMsg=null;
  if(state.role==="founder"){
    state.me.name=$("#obName").value.trim()||state.auth.name;
    state.me.startup=$("#obStartup").value.trim()||state.auth.name+"'s startup";
    state.me.sector=$("#obSector").value;state.me.stage=$("#obStage").value;
    state.me.raising=parseFloat($("#obRaising").value)||state.me.raising;
    state.me.traction=$("#obTraction").value.trim();
  }else{
    state.vcMe.name=$("#obFund").value.trim()||"My Fund";
    state.vcMe.type=$("#obType").value;
    state.vcMe.city=$("#obCity").value.trim()||"India";
    state.vcMe.sectors=[...document.querySelectorAll("#obSectors .chip.acc")].map(x=>x.textContent);
    state.vcMe.stages=[...document.querySelectorAll("#obStages .chip.acc")].map(x=>x.textContent);
    if(!state.vcMe.sectors.length)state.vcMe.sectors=["SaaS"];
    if(!state.vcMe.stages.length)state.vcMe.stages=["Pre-seed"];
    const mn=parseFloat($("#obMin").value),mx=parseFloat($("#obMax").value);
    const cc0=capCheque(mn,mx);
    if(cc0){state.vcMe.cheque=cc0.cheque;capMsg=capNote(cc0);}
    state.vcMe.thesisUpdatedAt=Date.now();
  }
  save();closeModal();void persistCurrentProfile();go("home");
  toast(state.role==="founder"?"Funds sorted by fit are in Matches":(capMsg||"Deal flow matched to your thesis is ready"));
}

function asstSuggest(){return state.role==="founder"
  ?["How do I find VCs?","How do I request an introduction?","How do I manage my pipeline?","Where is my pitch deck?"]
  :["How do I find startups?","How do I review a deal?","How do I share a deck with partners?","What are Partners?"]}
function asstReply(q){
  const t=" "+q.toLowerCase().replace(/[^a-z0-9₹ -]/g," ")+" ";
  const kb=state.role==="founder"?KB_F:KB_V;let best=null,bs=0;
  kb.forEach(e=>{let s=0;e.k.forEach(k=>{if(t.includes(k))s+=k.length});if(s>bs){bs=s;best=e}});
  if(best)return{a:best.a,go:best.go};
  return{a:"I can help with using VC Sure — finding "+(state.role==="founder"?"funds":"startups")+", meetings, messages, your profile and more. Try one of these:",sug:true};
}
function openAssistant(){
  if(asstRole!==state.role){asstLog=[];asstRole=state.role}
  asstOpen=true;asstDraw();
  if(matchMedia("(min-width:701px)").matches)setTimeout(()=>{const i=$("#asstText");if(i)i.focus()},40);
}
function closeAssistant(){asstOpen=false;const r=$("#asstRoot");if(r)r.innerHTML=""}
function asstDraw(){
  const r=$("#asstRoot");if(!r)return;if(!asstOpen){r.innerHTML="";return}
  const last=asstLog[asstLog.length-1];const showSug=!last||last.sug;
  r.innerHTML=`<section class="asst" role="dialog" aria-label="Mitra">
    <div class="asstHead"><div class="logo-mark">M</div><div class="asstT"><b>Mitra</b><span>Your VC Sure guide · here to help</span></div>
      <button type="button" class="asstX" onclick="closeAssistant()" aria-label="Close Mitra"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="asstLog" id="asstLog">
      <div class="cmsg them">Hi, I'm Mitra. Ask me where things are or how a feature works in the ${state.role==="founder"?"Startup":"VC"} portal.</div>
      ${asstLog.map(m=>m.u!==undefined?`<div class="cmsg me">${esc(m.u)}</div>`
        :`<div class="cmsg them">${m.a}${m.go?`<div class="chatChips" style="margin:8px 0 0"><button class="chip acc" onclick="asstGo('${m.go[0]}'${m.go[1]?`,'${m.go[1]}'`:""})">Open ${navLabel(m.go[0],m.go[1])}</button></div>`:""}</div>`).join("")}
      ${showSug?`<div class="chatChips">${asstSuggest().map(s=>`<button class="chip acc" onclick="asstAsk(this.textContent)">${esc(s)}</button>`).join("")}</div>`:""}
    </div>
    <div class="chatInput asstIn"><input id="asstText" placeholder="Ask how to do something…" aria-label="Help" onkeydown="if(event.key==='Enter')asstAsk()"><button class="btn" onclick="asstAsk()">Ask</button></div></section>`;
  const l=$("#asstLog");if(l)l.scrollTop=l.scrollHeight;
}
function asstAsk(text){
  const i=$("#asstText");let q=typeof text==="string"?text:(i?i.value:"");q=(q||"").trim();if(!q)return;
  asstLog.push({u:q});asstLog.push(asstReply(q));asstDraw();
  if(matchMedia("(min-width:701px)").matches){const n=$("#asstText");if(n)n.focus()}
}
function asstGo(v,tab){
  if(v==="profile"&&tab&&state.role==="founder")pTab=tab;
  if(v==="partners"){openThreadId=null;pFilter=tab==="shared"?"shared":"all"}
  closeAssistant();go(v);
}

/* VC Sure-styled dropdown (replaces native <select> so the OS/Chrome sheet never appears) */
function dd(id,label,val,opts,setter){
  const cur=(opts.find(o=>o[0]===val)||opts[0])[1];
  return `<div class="dd" id="dd_${id}"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="${label}" onclick="ddToggle('${id}',event)"><span class="ellip">${esc(cur)}</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="dd-menu" role="listbox">${opts.map(o=>`<button type="button" role="option" class="dd-opt ${o[0]===val?"sel":""}" aria-selected="${o[0]===val}" onclick="ddPick('${setter}',this.dataset.v)" data-v="${esc(o[0])}"><span>${esc(o[1])}</span>${o[0]===val?`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>`:""}</button>`).join("")}</div></div>`;
}
function ddClose(){document.querySelectorAll(".dd.open").forEach(d=>{d.classList.remove("open","right");const b=d.querySelector(".dd-btn");if(b)b.setAttribute("aria-expanded","false")})}
function ddToggle(id,e){e.stopPropagation();const d=document.getElementById("dd_"+id);const was=d.classList.contains("open");ddClose();if(was)return;
  d.classList.add("open");d.querySelector(".dd-btn").setAttribute("aria-expanded","true");
  const m=d.querySelector(".dd-menu");if(m.getBoundingClientRect().right>window.innerWidth-12)d.classList.add("right")}
function ddPick(k,v){ddClose();if(k==="dSector")dSector=v;else if(k==="dStage")dStage=v;else if(k==="dCheque")dCheque=v;else if(k==="dSort")dSort=v;render()}
document.addEventListener("click",e=>{if(!e.target.closest||!e.target.closest(".dd"))ddClose()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){ddClose();if(asstOpen)closeAssistant()}});

/* ================= AI note coach ================= */
function analyzeNote(text,vc){
  const t=text.toLowerCase();let score=0;const tips=[];
  if(text.length>=80)score+=20;else tips.push("two lines minimum — one-line notes read as spam");
  if(/\d|%|\u20B9|\bcr\b|\blakh\b/.test(t))score+=25;else tips.push("add a number: traction, MRR, users or savings");
  if(vc.sectors.some(s=>t.includes(s.toLowerCase())))score+=20;else tips.push("name-drop their sector: "+vc.sectors.join(" or "));
  if(/(traction|pilot|users?|customers?|mrr|gmv|waitlist|paying|retention)/.test(t))score+=20;else tips.push("mention live traction — funds move on numbers");
  if(t.includes(vc.name.toLowerCase().split(" ")[0]))score+=10;
  if(/(love your fund|great fit|excited|honoured|honored|pleased|it would be)/.test(t)){score-=10;tips.push("cut the fluff — funds skim pleasantries")}
  return{score:Math.max(5,Math.min(98,score)),tips};
}
function coachText(vc){
  const sect=vc.sectors[0]||state.me.sector;
  return `${esc(vc.name)} prioritizes ${sect.toLowerCase()} metrics — mention your ${state.me.traction?"live traction ("+esc(state.me.traction.toLowerCase())+")":"active pilot traction"} in these lines to boost acceptance by up to 40%.`;
}
function draftNote(vc){
  const t=state.me.traction||"our pilot numbers compound month on month";
  return `We're a ${state.me.stage.toLowerCase()} ${state.me.sector.toLowerCase()} startup raising ${cr(state.me.raising)} — ${t}. ${vc.name.split(" ")[0]}'s ${vc.sectors[0]?vc.sectors[0].toLowerCase():""} thesis matches where we're headed; 15 minutes will show you the numbers.`;
}
function runCoach(id){
  const vc=vcById(id);if(!vc)return;
  const note=$("#rqNote").value.trim();
  const r=analyzeNote(note,vc);
  $("#coachMount").innerHTML=`<div class="coach"><b>AI note coach — strength ${r.score}/100</b>
    <div class="bar"><i style="width:${r.score}%"></i></div>
    <div style="font-size:12.5px">${coachText(vc)}</div>
    ${r.tips.length?`<ul>${r.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    <div style="margin-top:10px"><button class="btn sm" onclick="applyDraft('${id}')">Rewrite my note</button></div></div>`;
}

function chatChips(m){
  if(m.slot)return null;
  const other=chatCounterpart(m),msgs=m.chat||[];
  for(let i=msgs.length-1;i>=0;i--){
    if(msgs[i].from===other){
      const tm=extractTime(msgs[i].text);
      if(tm)return [tm,"Can we find another slot?"];
      break;
    }
  }
  return ["Tue 11:00 AM IST","Wed 4:30 PM IST","Thu 10:00 AM IST"];
}
function extractTime(t){
  const m=t.match(/((?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\s+)?(\d{1,2}:\d{2}\s*(?:am|pm)(?:\s*ist)?)/i);
  return m?((m[1]||"")+m[2]).trim():null;
}
function chatQuick(idx,el){sendChat(idx,el.textContent)}
function sendChat(idx,text){
  const m=state.meetings[idx];if(!m)return;
  let t=typeof text==="string"?text:"";
  if(!t&&$("#chatText")&&$("#chatText").value)t=$("#chatText").value;
  t=(t+"").trim();
  if(!t)return;
  if(!m.chat)m.chat=[];
  m.chat.push({from:state.role,text:t,ts:Date.now()});
  const other=chatCounterpart(m);
  const timeMsg=/\b\d{1,2}:\d{2}\s*(am|pm)/i.test(t)||/^(tue|wed|thu|fri|mon|sat|sun)/i.test(t);
  if(!m.slot&&timeMsg&&m.status==="accepted"){
    const time=extractTime(t)||t.slice(0,48);
    m.slot=time;
    m.chat.push({from:other,text:"Confirmed — "+time+" it is. Invite sent.",ts:Date.now()+1});
  }else{
    const pool=!m.slot
      ?["Sounds good — which of the proposed slots works for you?","Great. What time suits you? We're flexible Tue-Thu."]
      :["Noted — looking forward.","Works for us. Anything you'd like prepped beforehand?","Great, see you then."];
    m.chat.push({from:other,text:pool[m.chat.length%pool.length],ts:Date.now()+1});
  }
  save();
  if(view==="messages")msgRefresh();
  else if(view==="meetings"||view==="home")render();
}

load();checkExpiries();render();
initAuth();
if(sb){
  sb.auth.onAuthStateChange((event,session)=>{
    setTimeout(async()=>{
      if(event==="SIGNED_OUT"){state.authed=false;state.auth={name:"",email:""};state.role=null;save();render();return;}
      if(session?.user && (event==="TOKEN_REFRESHED"||event==="USER_UPDATED")){
        if(!state.auth?.id||state.auth.id!==session.user.id||!state.authed)await acceptAuthenticatedUser(session.user,session);
      }
    },0);
  });
}
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue){try{state=JSON.parse(e.newValue);render()}catch(_){}}});
</script>
</body>
</html>
